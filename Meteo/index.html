<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a5f">
  <title>Meteo Oggi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="loadingText">Rilevamento della posizione in corso…</p>
</div>

<div class="wrap">
  <header>
    <div class="loc-block">
      <div class="loc-name"><span id="locIcon">📍</span><span id="locName">—</span></div>
      <div class="loc-sub" id="locSub"></div>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="header-btn" aria-label="Aggiorna dati meteo" title="Aggiorna dati">↻</button>
      <button id="settingsBtn" class="header-btn" aria-label="Scegli modelli meteo" title="Modelli meteo">⚙️</button>
      <button id="searchBtn" class="header-btn" aria-label="Cerca località">🔍</button>
    </div>
  </header>

  <div id="searchPanel">
    <div class="search-box">
      <div class="search-row">
        <div class="input-wrap">
          <input id="searchInput" type="text" placeholder="Cerca una città…" autocomplete="off" aria-label="Cerca una città">
          <button id="clearSearch" type="button" aria-label="Svuota ricerca">✕</button>
        </div>
        <button id="gpsBtn" title="Usa la mia posizione">📡</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

  <main>
    <div id="currentCard" class="card" role="button" tabindex="0" aria-label="Dettagli meteo attuali">
      <div class="cur-top">
        <div>
          <div class="cur-temp" id="curTemp">--°</div>
          <div class="cur-cond" id="curCond">—</div>
          <div class="cur-feels" id="curFeels"></div>
        </div>
        <div class="cur-icon" id="curIcon">⛅</div>
      </div>
      <div class="cur-minmax">
        <span>Max <b id="curMax">--°</b></span>
        <span>Min <b id="curMin">--°</b></span>
      </div>
      <div class="tap-hint">👆 Tocca per i dettagli</div>
    </div>

    <h2 class="section">Prossime 24 ore</h2>
    <div id="hourlyScroll"></div>

    <h2 class="section">Prossimi 7 giorni</h2>
    <div id="dailyList"></div>
  </main>

  <footer>Dati: Open-Meteo.com · Geocoding: BigDataCloud / Open-Meteo</footer>
</div>

<div id="overlay"></div>
<div id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/touch.js"></script>
<script src="js/app.js"></script>

</body>
</html>
